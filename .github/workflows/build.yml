name: Android CI Build

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Configure Release Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.jks
            cat <<EOF > keystore.properties
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon

      - name: Clean Signing Files
        if: always()
        run: rm -f release.jks keystore.properties

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LockGuard-apks
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          REL_SHA=$(sha256sum "$RELEASE_APK" | awk '{print $1}')
          DBG_SHA=$(sha256sum "$DEBUG_APK" | awk '{print $1}')
          cat <<EOF > release_notes.md
          ## 界面重构与体验升级 (v1.3)

          - **Material 3 卡片化界面重构**：状态与主控合并为顶部状态卡片，未授权/缺失权限按钮仅在需要时出现，正常状态下自动隐藏，消除冗余大按钮
          - **下滑自动折叠顶部面板**：采用 \`CoordinatorLayout\` + \`AppBarLayout\`，下滑应用列表时顶部状态与规则卡片自动收起，搜索栏与筛选工具条吸顶固定
          - **紧凑规则展示**：生效时段明确标注 \`开始 / 结束\`，延迟输入标注 \`锁屏等待 xx 分钟\`，已选应用压缩为单行摘要
          - **批量筛选与管理**：新增 \`仅看已选\`、\`系统应用\` 筛选 Chip，以及 \`全选当前\`、\`清空已选\`（带二次确认弹窗）与搜索框一键清空按钮
          - **圆角列表项卡片**：应用列表改为圆角边框卡片，浅色/深色主题视觉更协调

          ## 固定正式签名

          - 配置 GitHub Secrets 固定 Release 签名（证书 SHA-256: \`2A:13:7B:CB:47:ED:D2:0C:9C:05:E1:19:FD:0B:B9:09:22:98:16:CD:99:24:24:14:DA:91:1D:BD:4A:85:EE:5D\`），后续 CI 每次构建的 \`app-release.apk\` 签名完全一致，支持直接覆盖升级

          ## 校验

          - \`app-release.apk\` SHA-256: \`$REL_SHA\`
          - \`app-debug.apk\` SHA-256: \`$DBG_SHA\`
          EOF

          gh release create "${GITHUB_REF_NAME}" "$RELEASE_APK" "$DEBUG_APK" \
            --title "${GITHUB_REF_NAME} — Material 3 界面重构与固定签名发布" \
            --notes-file release_notes.md
