name: Android CI Build

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Configure Release Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.jks
            cat <<EOF > keystore.properties
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon

      - name: Clean Signing Files
        if: always()
        run: rm -f release.jks keystore.properties

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LockGuard-apks
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          REL_SHA=$(sha256sum "$RELEASE_APK" | awk '{print $1}')
          DBG_SHA=$(sha256sum "$DEBUG_APK" | awk '{print $1}')
          cat <<EOF > release_notes.md
          ## 本次更新 (${GITHUB_REF_NAME})

          - **修复时间选择按钮文字换行截断问题**：优化「开始 / 结束」时段按钮与操作按钮内边距及高度自适应（\`wrap_content\` + \`minHeight\` + 单行限制），解决小屏或大字体下 \`开始 23:00\` / \`结束 07:00\` 上下显示不全的问题
          - **包含 v1.3 全部 Material 3 卡片化界面与固定签名特性**：下滑自动折叠顶部面板、吸顶搜索框、\`仅看已选\` / \`系统应用\` / \`全选当前\` / \`清空已选\` 快捷筛选条，以及固定 Release 签名（证书 SHA-256: \`2A:13:7B:CB:47:ED:D2:0C:9C:05:E1:19:FD:0B:B9:09:22:98:16:CD:99:24:24:14:DA:91:1D:BD:4A:85:EE:5D\`）

          ## 校验

          - \`app-release.apk\` SHA-256: \`$REL_SHA\`
          - \`app-debug.apk\` SHA-256: \`$DBG_SHA\`
          EOF

          gh release create "${GITHUB_REF_NAME}" "$RELEASE_APK" "$DEBUG_APK" \
            --title "${GITHUB_REF_NAME} — 修复时间按钮文字截断与显示优化" \
            --notes-file release_notes.md
