name: Android CI Build

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LockGuard-apks
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          REL_SHA=$(sha256sum "$RELEASE_APK" | awk '{print $1}')
          DBG_SHA=$(sha256sum "$DEBUG_APK" | awk '{print $1}')
          cat <<EOF > release_notes.md
          ## 核心机制与省电可靠性优化

          - **息屏 Doze 休眠准时唤醒**：改用 \`AlarmManager.setAndAllowWhileIdle(ELAPSED_REALTIME_WAKEUP)\` 配合 15s 超时 \`PARTIAL_WAKE_LOCK\`，解决原先 \`Handler.postDelayed\` 在手机进入 CPU 深度休眠后停表导致的延迟关闭失准问题
          - **单次锁屏周期防重复强杀**：新增 \`stoppedInCurrentLockSession\` 状态追踪，避免同一次锁屏期间每隔 \`delayMinutes\` 无限循环重复强行停止目标应用
          - **移除 60 秒轮询**：去除全天候每分钟唤醒轮询，改为在锁屏处于时间窗外时精准预约时间窗起点唤醒检查，大幅降低后台耗电
          - **无锁屏密码场景支持**：新增监听 \`ACTION_SCREEN_ON\`，未设锁屏密码直接亮屏时也能正确取消待执行任务
          - **开机与覆盖更新自启**：新增 \`BootReceiver\` 监听 \`BOOT_COMPLETED\` 与 \`MY_PACKAGE_REPLACED\`，重启手机或更新应用后自动恢复监控服务

          ## 性能与交互体验优化

          - **Shizuku 强杀提速**：\`StopControllerService\` 优先通过反射直接调用系统 \`IActivityManager.forceStopPackage\`（毫秒级完成，零子进程开销），异常时无缝回退至 \`/system/bin/am force-stop\`
          - **应用搜索与系统应用过滤**：主界面新增按应用名/包名实时搜索框及「显示系统应用」过滤开关（已选系统应用始终保留显示）
          - **应用列表去重与防跳动**：按 \`packageName\` 去重多桌面入口应用；点击勾选时仅局部刷新当前行，不再立即重排导致列表跳动
          - **运行中配置热重载**：监控运行中修改勾选应用、时间段、延迟或开关时自动保存并通知服务实时生效
          - **最近执行记录与权限按钮优化**：主界面状态栏与常驻通知展示最近一次执行时间与关闭统计；通知权限授予后自动隐藏权限按钮

          ## 校验

          - \`app-release.apk\` SHA-256: \`$REL_SHA\`
          - \`app-debug.apk\` SHA-256: \`$DBG_SHA\`
          EOF

          gh release create "${GITHUB_REF_NAME}" "$RELEASE_APK" "$DEBUG_APK" \
            --title "${GITHUB_REF_NAME} — Doze 准时唤醒、Shizuku 强杀提速与交互体验全面优化" \
            --notes-file release_notes.md
